<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体操採点システム - 観覧用ページ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #0f1923; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  .logo { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #7a8a99; margin-bottom: 36px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; max-width: 360px; }
  .card {
    background: #1a2634; border: 1px solid #2a3a4a; border-radius: 16px;
    padding: 24px 20px; text-align: center; text-decoration: none; color: #fff; display: block;
    transition: all 0.2s;
  }
  .card:hover { background: #1e2e3e; border-color: #4a9eff; transform: translateY(-2px); }
  .card-icon { font-size: 32px; margin-bottom: 10px; }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .card-desc { font-size: 12px; color: #7a8a99; }
  .note { margin-top: 32px; font-size: 11px; color: #4a5a6a; max-width: 360px; text-align: center; line-height: 1.6; }
  button.card { width:100%; font-family:inherit; cursor:pointer; }
  .card.guide { background:#14243a; border-color:#2f5a8a; }
  .tip { margin-top:20px; font-size:12px; color:#c5d0da; max-width:360px; line-height:1.7; background:#16212e; border:1px solid #2a3a4a; border-radius:12px; padding:10px 14px; }
  .tip b { color:#ffd36a; }
</style>
<script src="fan.js"></script>
</head>
<body>
  <div class="logo">🤸</div>
  <h1>体操採点システム</h1>
  <p class="subtitle">観覧用ページ（閲覧専用）</p>

  <div class="cards">
    <!-- 記録一覧（scoreboard.html）へのリンクは2026-10-08に外した。フォロー・速報・検索は「結果」ページで使える。ファイルは残しているのでURL直接なら開ける -->
    <a href="results.html" class="card">
      <div class="card-icon">📊</div>
      <div class="card-title">結果（リザルト）</div>
      <div class="card-desc">種目別・個人総合のランキング。選手のフォロー・速報・所属や名前での絞り込みもここから</div>
    </a>
    <a href="team_results.html" class="card">
      <div class="card-icon">🏅</div>
      <div class="card-title">団体総合</div>
      <div class="card-desc">チーム別・種目上位N名合計のランキング</div>
    </a>
    <button type="button" class="card guide" onclick="Fan.openGuide()">
      <div class="card-icon">❓</div>
      <div class="card-title">得点の見かた</div>
      <div class="card-desc">D・E・NDってなに？ 順位の決まり方は？</div>
    </button>
    <a href="display.html" class="card">
      <div class="card-icon">🖥️</div>
      <div class="card-title">場内表示</div>
      <div class="card-desc">種目を選んで大画面表示と同じ内容を見る</div>
    </a>
  </div>

  <p class="tip">⭐ <b>選手をフォロー</b>：「結果」のページ上部で選手を選ぶと、その選手の得点と順位がまとめて表示され、得点が出たらお知らせします。</p>
  <p class="note">このページは観覧専用です。得点の入力・編集はできません。</p>

  <script>
    // 公開オン/オフの確認（/healthは観覧者にも公開されている軽量エンドポイント）
    fetch('/health').then(r => r.json()).then(d => {
      if (d.publicEnabled === false) {
        const overlay = document.createElement('div');
        overlay.style.cssText = `
          position:fixed; inset:0; z-index:99999;
          background:#0f1923; color:#fff;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          font-family:'Helvetica Neue',Arial,sans-serif; text-align:center; padding:24px;
        `;
        overlay.innerHTML = `
          <div style="font-size:48px;margin-bottom:16px">🤸</div>
          <div style="font-size:20px;font-weight:700;margin-bottom:8px">次の大会までお待ちください</div>
          <div style="font-size:13px;color:#7a8a99;max-width:320px;line-height:1.6">
            現在このページは公開されていません。<br>大会開催時に改めてご確認ください。
          </div>
        `;
        document.body.appendChild(overlay);
      }
    }).catch(() => {});
  </script>
</body>
</html>
